<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace client — DOCTEL</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo-link" aria-label="DOCTEL - Accueil">
      <img src="assets/logo.svg" alt="DOCTEL" class="logo-img">
    </a>
  </div>
</header>

<main>
  <section class="section" style="padding-top:70px;">
    <div class="container" style="max-width:640px; text-align:center;">
      <p class="eyebrow">Espace client</p>
      <h2>Accéder à votre agenda</h2>
      <p class="section-lead" style="margin-left:auto; margin-right:auto;">
        La gestion de votre agenda est assurée via notre outil partenaire WZ-Conseil.
        Connectez-vous ci-dessous pour accéder à votre espace.
      </p>

      <div class="login-card">
        <form id="WZLoginForm" method="post" class="login-form">
          <div class="form-field">
            <label for="WZInputEmail">Email</label>
            <input id="WZInputEmail" type="email" placeholder="Email" required autofocus>
          </div>
          <div class="form-field">
            <label for="WZInputPassword">Mot de passe</label>
            <input id="WZInputPassword" type="password" placeholder="Mot de passe" required>
          </div>
          <button type="submit" class="btn btn-primary login-submit">Se connecter</button>
          <a id="WZLinkPassword" class="login-forgot">Mot de passe oublié ?</a>
          <span id="WZLoginAlert" class="login-alert"></span>
        </form>
      </div>

      <p style="margin-top:24px;"><a href="index.html">&larr; Retour à l'accueil</a></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <img src="assets/logo.svg" alt="DOCTEL" class="footer-logo">
    <p>&copy; 2026 DOCTEL — Télésecrétariat médical, Clermont-Ferrand.</p>
  </div>
</footer>

<script src="https://cdn.wz-agenda.net/assets/js/login.js"></script>
<script>window.onload = WZInit;</script>
</body>
</html>
