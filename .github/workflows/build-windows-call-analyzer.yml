name: Build Windows executable (Analyse interne des appels)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "call-analyzer/**"
      - ".github/workflows/build-windows-call-analyzer.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: call-analyzer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construire l'exécutable
        run: pyinstaller packaging/call_analyzer.spec

      - name: Publier l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: CADUCEA-analyse-interne-appels-windows
          path: "call-analyzer/dist/CADUCEA - Analyse interne des appels.exe"
