name: Build Windows executable (Statistiques d'appels)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop-app/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construire l'exécutable
        run: pyinstaller packaging/callstats.spec

      - name: Publier l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: DoctelStatsAppels-windows
          path: desktop-app/dist/DoctelStatsAppels.exe
